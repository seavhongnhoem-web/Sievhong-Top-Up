<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Up Free Fire - 70% OFF</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #007bff;
            --primary-light: #00d2ff;
            --dark: #121629;
            --dark-card: #1a1f36;
            --text-light: #ffffff;
            --text-dim: #8a99ad;
            --discount: #ff0055;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: var(--dark-card);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin: 15px;
            border: 1px solid rgba(0, 210, 255, 0.1);
        }

        .promo-banner {
            background: linear-gradient(45deg, #ff0055, #ff5500);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 20px;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(45deg, var(--primary-light), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
            font-weight: bold;
        }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-dim); }
        
        input {
            width: 100%;
            padding: 14px;
            background-color: var(--dark);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 10px;
            color: var(--text-light);
            font-size: 16px;
            box-sizing: border-box;
        }

        .packages {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .package-card {
            background-color: var(--dark);
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(0, 210, 255, 0.1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .package-card.active {
            border-color: var(--primary-light);
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.15), rgba(0, 210, 255, 0.15));
        }

        .badge-discount {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--discount);
            color: white;
            font-size: 10px;
            font-weight: bold;
            padding: 3px 8px;
            border-bottom-left-radius: 8px;
        }

        .package-card .gems { display: block; font-size: 18px; font-weight: bold; margin-top: 5px; }
        
        .price-box {
            margin-top: 5px;
        }

        .old-price {
            text-decoration: line-through;
            color: var(--text-dim);
            font-size: 12px;
            margin-right: 5px;
        }

        .new-price {
            color: var(--primary-light);
            font-size: 16px;
            font-weight: bold;
        }

        .aba-box {
            background: linear-gradient(135deg, #003352, #005c8a);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .aba-details { font-size: 14px; line-height: 1.6; }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #0088cc;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="promo-banner">
            🔥 ឱកាសពិសេស! បញ្ចុះតម្លៃ 70% គ្រប់កញ្ចប់ 🔥
        </div>

        <h2><i class="fa-solid fa-gem"></i> TOP-UP FREE FIRE</h2>
        
        <form>
            <div class="form-group">
                <label>១. បញ្ចូល Player ID</label>
                <input type="number" placeholder="ឧទាហរណ៍: 123456789" required>
            </div>

            <label>២. ជ្រើសរើសកញ្ចប់ពេជ្រ (-70% OFF)</label>
            <div class="packages">
                <div class="package-card">
                    <span class="badge-discount">-70%</span>
                    <span class="gems">100 💎</span>
                    <div class="price-box">
                        <span class="old-price">$0.99</span>
                        <span class="new-price">$0.30</span>
                    </div>
                </div>

                <div class="package-card active">
                    <span class="badge-discount">-70%</span>
                    <span class="gems">520 💎</span>
                    <div class="price-box">
                        <span class="old-price">$4.99</span>
                        <span class="new-price">$1.50</span>
                    </div>
                </div>

                <div class="package-card">
                    <span class="badge-discount">-70%</span>
                    <span class="gems">1060 💎</span>
                    <div class="price-box">
                        <span class="old-price">$9.99</span>
                        <span class="new-price">$3.00</span>
                    </div>
                </div>

                <div class="package-card">
                    <span class="badge-discount">-70%</span>
                    <span class="gems">Weekly Pass</span>
                    <div class="price-box">
                        <span class="old-price">$1.99</span>
                        <span class="new-price">$0.60</span>
                    </div>
                </div>
            </div>

            <label>៣. ព័ត៌មានទូទាត់ប្រាក់ (ABA Bank)</label>
            <div class="aba-box">
                <div class="aba-details">
                    <div>ឈ្មោះគណនី: <strong>Nhoem sievhong</strong></div>
                    <div>លេខគណនី: <strong id="aba-num">011918521</strong></div>
                </div>
            </div>

            <a href="https://t.me/your_telegram" target="_blank" class="btn-submit">
                <i class="fa-brands fa-telegram"></i> ផ្ញើវិក្កយបត្រតាម Telegram
            </a>
        </form>
    </div>

</body>
</html>
